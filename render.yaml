services:
  # 1. Back-end Web Service (FastAPI - Stateless)
  - type: web
    runtime: docker
    name: sketch-1-backend
    env: docker
    region: ohio
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile

  # 2. Front-end Static Site
  - type: web
    runtime: docker
    name: sketch-1-frontend
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
